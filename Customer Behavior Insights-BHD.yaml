openapi: 3.0.3

info:
  title: Customer Behavior Insights - BHD
  description: >
    This Service Domain applies behavioral analysis to customer event history
    to maintain customer insights, ratings scores and other related indicators.
  version: 1.0.0

servers:
  - url: https://api.bian.org/v1
    description: Main BIAN server

paths:
  /CustomerBehaviorInsights/{identificationnumber}/RestrictiveLists/Insight/Retrieve:
    post:
      tags:
        - BQ - Insight
      summary: Retrieve customer restrictive lists insight
      description: Retrieve restrictive lists insight information for a customer based on the identification number and application context.
      operationId: RetrieveRestrictiveListsInsight

      parameters:
        - in: path
          name: identificationnumber
          required: true
          description: Customer identification number.
          schema:
            type: string
            example: "40222151504"

        - in: header
          name: applicationId
          required: true
          description: Application identifier associated with the restrictive lists insight request.
          schema:
            type: string
            example: "APP-20260615-0001"

      responses:
        '200':
          description: Successful restrictive lists insight retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRestrictiveListsInsightResponse'

        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accept'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unathorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:

  schemas:

    RetrieveRestrictiveListsInsightResponse:
      type: object
      description: Response containing the restrictive lists insight retrieval result.
      properties:
        ResponseCode:
          type: string
          description: Unique response code that identifies the successful result.
          example: "200OK"

        Message:
          type: string
          description: General message associated with the successful operation.
          example: "Successful"

        Data:
          $ref: '#/components/schemas/RestrictiveListsInsightData'

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.
          example: "2026-06-19T15:30:00Z"

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.
          example: "req_12345"

    RestrictiveListsInsightData:
      type: object
      description: Restrictive lists insight result data.
      properties:
        Message:
          type: string
          description: Restrictive lists insight result message.
          example: "Restrictive lists insight retrieved successfully"

    HttpError:
      type: object
      description: Standard structure for API error responses.
      properties:
        ResponseCode:
          type: string
          format: string
          description: Unique code that identifies the response result.
          example: "400BAD"

        Message:
          type: string
          format: string
          description: General response message associated with the operation result.
          example: "Bad request"

        Errors:
          type: array
          description: List of errors returned by the service.
          items:
            $ref: '#/components/schemas/Error'

        Timestamp:
          type: string
          format: string
          description: Date and time when the response was generated.
          example: "2026-06-19T15:30:00Z"

        RequestId:
          type: string
          format: string
          description: Unique identifier associated with the request transaction.
          example: "req_12345"

    Error:
      type: object
      description: Error detail returned when the operation cannot be completed successfully.
      properties:
        Field:
          type: string
          description: Name of the field associated with the error.
          example: "identificationnumber"

        Code:
          type: string
          description: Specific error code associated with the validation or processing issue.
          example: "INVALID_VALUE"

        Message:
          type: string
          description: Detailed error message.
          example: "Invalid customer identification number."

    Response:
      type: object
      description: Standard structure for successful responses.
      properties:
        ResponseCode:
          type: string
          description: Unique response code that identifies the result.

        Message:
          type: string
          description: General message associated with the operation result.

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.




  responses:
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example: 
            ResponseCode: "201CREATED"
            Message: "Created"
            Timestamp: "2026-07-31T10:30:00Z"
            RequestId: "req_12345"            
    Accept:
      description: Accept
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example: 
