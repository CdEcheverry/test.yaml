openapi: 3.0.3

info:
  title: Customer Campaign Execution - BHD
  description: API used to register customer campaign interaction responses.
  version: 1.0.0

servers:
  - url: https://api.bian.org/v1
    description: Main BIAN server

paths:
  /CustomerCampaignExecution/CustomerAcquisitionSource/Initiate:
    post:
      tags:
        - BQ - Execution
      summary: Register customer acquisition source
      description: Register the customer response to the question about how they learned about the institution.
      operationId: InitiateCustomerAcquisitionSource

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAcquisitionSourceRequest'

      responses:
        '200':
          description: Customer acquisition source successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAcquisitionSourceResponse'

        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accept'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unathorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:

  schemas:

    CustomerAcquisitionSourceRequest:
      type: object
      description: Request used to register how the customer learned about the institution.
      properties:
        CustomerCampaignProcedure:
          $ref: '#/components/schemas/CustomerCampaignProcedure'

        Execution:
          $ref: '#/components/schemas/CustomerAcquisitionSourceExecution'

    CustomerCampaignProcedure:
      type: object
      description: Customer campaign or onboarding-related interaction context.
      properties:
        CustomerCampaignType:
          type: string
          description: Type or category of customer campaign or interaction.
          example: "Customer Acquisition"

    CustomerAcquisitionSourceExecution:
      type: object
      description: Execution information related to the customer acquisition source response.
      properties:
        CustomerReference:
          $ref: '#/components/schemas/InvolvedParty'

        ApplicationReference:
          $ref: '#/components/schemas/ApplicationReference'

        CustomerAcquisitionSource:
          $ref: '#/components/schemas/CustomerAcquisitionSource'

    InvolvedParty:
      type: object
      description: Customer reference information.
      properties:
        PartyReference:
          $ref: '#/components/schemas/PartyReference'

    PartyReference:
      type: object
      description: Party information associated with the customer.
      properties:
        PartyIdentification:
          $ref: '#/components/schemas/PartyIdentification'

    PartyIdentification:
      type: object
      description: Customer identification information.
      properties:
        PartyIdentificationType:
          type: string
          description: Type of customer identification document.
          example: "Cedula"

        IdentifierValue:
          $ref: '#/components/schemas/Value'

    ApplicationReference:
      type: object
      description: Reference to the onboarding application process.
      properties:
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    CustomerAcquisitionSource:
      type: object
      description: Customer answer to how they learned about the institution.
      properties:
        Question:
          type: string
          description: Question answered by the customer.
          example: "¿Cómo se enteró de nosotros?"

        Answer:
          type: string
          description: Customer answer indicating the source through which they learned about the institution.
          example: "Redes sociales"


    Value:
      type: object
      description: Generic value object.
      properties:
        Value:
          type: string
          description: Identifier value.
          example: "40222151504"

    CustomerAcquisitionSourceResponse:
      type: object
      description: Successful customer acquisition source registration response.
      properties:
        ResponseCode:
          type: string
          description: Unique response code that identifies the successful result.
          example: "200OK"

        Message:
          type: string
          description: General message associated with the successful operation.
          example: "Successful"

        Data:
          $ref: '#/components/schemas/CustomerAcquisitionSourceResponseData'

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.
          example: "2026-06-20T10:30:00Z"

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.
          example: "req_12345"

    CustomerAcquisitionSourceResponseData:
      type: object
      description: Customer acquisition source registration result.
      properties:
        Message:
          type: string
          description: Operation result message.
          example: "Customer acquisition source successfully registered"

    HttpError:
      type: object
      description: Standard structure for API error responses.
      properties:
        ResponseCode:
          type: string
          description: Unique code that identifies the response result.
          example: "400BAD"

        Message:
          type: string
          description: General response message associated with the operation result.
          example: "Bad request"

        Errors:
          type: array
          description: List of errors returned by the service.
          items:
            $ref: '#/components/schemas/Error'

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.
          example: "2026-06-20T10:30:00Z"

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.
          example: "req_12345"

    Error:
      type: object
      description: Error detail returned when the operation cannot be completed successfully.
      properties:
        Field:
          type: string
          description: Name of the field associated with the error.
          example: "CustomerAcquisitionSource.Answer"

        Code:
          type: string
          description: Specific error code associated with the validation or processing issue.
          example: "INVALID_VALUE"

        Message:
          type: string
          description: Detailed error message.
          example: "Invalid acquisition source answer."

    Response:
      type: object
      description: Standard structure for successful responses.
      properties:
        ResponseCode:
          type: string
          description: Unique response code that identifies the result.

        Message:
          type: string
          description: General message associated with the operation result.

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.




  responses:
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example: 
            ResponseCode: "201CREATED"
            Message: "Created"
            Timestamp: "2026-07-31T10:30:00Z"
            RequestId: "req_12345"            
    Accept:
      description: Accept
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example: 
            ResponseCode: "202Accept"
            Message: "Accept"
            Timestamp: "2026-07-31T10:30:00Z"
            RequestId: "req_12345"  

    BadRequest:
      description: BadRequest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Unathorized:
      description: Unathorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    NotFound:
      description: NotFound
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    MethodNotAllowed:
      description: MethodNotAllowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    RequestTimeout:
      description: RequestTimeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    UnprocessableContent:
      description: UnprocessableContent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    TooManyRequests:
      description: TooManyRequests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    InternalServerError:
      description: InternalServerError
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    NotImplemented:
      description: NotImplemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    BadGateway:
      description: BadGateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    ServiceUnavailable:
      description: ServiceUnavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    GatewayTimeout:
      description: GatewayTimeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
