openapi: 3.0.3

info:
  title: Customer Management API - BHD
  description: >
    Unified API for the Customer Management Domain. This API handles customer behavior insights, 
    product and service directories, party reference data (demographics, financials, profiles), 
    and sales product agreements (terms and conditions).
  version: 1.0.0

servers:
  - url: https://api.bian.org/v1
    description: Main BIAN server

paths:
  # =======================================================================
  # CUSTOMER BEHAVIOR INSIGHTS
  # =======================================================================
  /CustomerBehaviorInsights/{identificationnumber}/RestrictiveLists/Insight/Retrieve:
    post:
      tags:
        - BQ - Insight
      summary: Retrieve customer restrictive lists insight
      description: Retrieve restrictive lists insight information for a customer based on the identification number and application context.
      operationId: RetrieveRestrictiveListsInsight
      parameters:
        - in: path
          name: identificationnumber
          required: true
          description: Customer identification number.
          schema:
            type: string
            example: "40222151504"
        - in: header
          name: applicationId
          required: true
          description: Application identifier associated with the restrictive lists insight request.
          schema:
            type: string
            example: "APP-20260615-0001"
      responses:
        '200':
          description: Successful restrictive lists insight retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRestrictiveListsInsightResponse'
        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  # =======================================================================
  # CUSTOMER PRODUCT AND SERVICE DIRECTORY
  # =======================================================================
  /CustomerProductandServiceDirectory/Product/Register:
    post:
      tags:
        - BQ - Product
      summary: Register customer banking product
      description: Register any type of banking product associated with a customer during an onboarding or product acquisition process.
      operationId: RegisterCustomerBankingProduct
      parameters:
        - in: query
          name: applicationId
          required: true
          description: Application identifier associated with the onboarding or product acquisition process.
          schema:
            type: string
            example: "APP-20260615-0001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerProductRequest'
      responses:
        '200':
          description: Customer banking product successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCustomerProductResponse'
        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
