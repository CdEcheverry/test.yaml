components:
  schemas:
    # ---------------------------------------------------------
    # SHARED COMMON SCHEMAS
    # ---------------------------------------------------------
    Value:
      type: object
      description: Generic value container.
      properties:
        Value:
          type: string
          description: Value.
          example: "123456"

    Identifier:
      type: object
      description: Unique identifier information.
      properties:
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    Name:
      type: string
      description: Name object/string.
      example: "Name Example"

    Text:
      type: object
      description: Text object.
      properties:
        Text:
          type: string
          description: Text value.
          example: "Description or textual content."

    Date:
      type: object
      description: Date value.
      properties:
