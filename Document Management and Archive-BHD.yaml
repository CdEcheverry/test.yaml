        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /DocumentDirectory/UploadedSupports/Retrieve:
    get:
      tags:
        - CR - DocumentDirectoryEntry
      summary: Retrieve uploaded supporting document existence
      description: Retrieves the list of supporting documents that already exist in the document repository for a customer during the onboarding process, without returning the document content.
      operationId: RetrieveUploadedSupportingDocumentExistence
      parameters:
        - in: header
          name: identificationNumber
          required: true
          description: Customer identification document number.
          schema:
            type: string
            example: "40222151504"
        - in: header
          name: identificationType
          required: false
          description: Customer identification document type.
          schema:
            type: string
            example: "Cedula"
        - in: query
          name: applicationId
          required: true
          description: Application identifier associated with the onboarding process.
          schema:
            type: string
            example: "APP-20260615-0001"
      responses:
        '200':
          description: Uploaded supporting documents successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedSupportsRetrieveResponse'
