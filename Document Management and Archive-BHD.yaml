openapi: 3.0.3

info:
  title: Document Management and Archive API - BHD
  description: >
    Unified API for Document Management and Archive Domain. 
    This API handles pre-formatted correspondence, document directory categorization, 
    storage, signature support, upload, retrieval, and document validation processes 
    during onboarding.
  version: 1.0.0

servers:
  - url: https://api.bian.org/v1
    description: Main BIAN server

paths:
  # =======================================================================
  # CORRESPONDENCE SUBDOMAIN
  # =======================================================================
  /Correspondence/OutboundWithResponse/Otp/Send/Initiate:
    post:
      tags:
        - BQ - OutboundWithResponse
      summary: Send OTP
      description: Send an OTP to a customer email address as part of an authentication process.
      operationId: InitiateOtpSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: OTP successfully sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /Correspondence/OutboundWithResponse/Email/Send/Initiate:
    post:
      tags:
        - BQ - OutboundWithResponse
      summary: Send Email
      description: Send an email to a customer using a predefined template as part of an onboarding process.
      operationId: InitiateEmailSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendRequest'
      parameters:
        - in: query
          name: applicationId
          required: true
          description: Unique identifier of the onboarding application process used to retrieve the customer information.
          schema:
            $ref: '#/components/schemas/ApplicationId'
      responses:
        '200':
          description: Email successfully sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'
        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  # =======================================================================
  # DOCUMENT DIRECTORY SUBDOMAIN
  # =======================================================================
  /DocumentDirectory/Signed/Register:
    post:
      tags:
        - CR - DocumentDirectoryEntry
      summary: Register Signed Document
      description: Registers a signed document generated during the onboarding process.
      operationId: RegisterSignedDocument
      parameters:
        - in: header
          name: identificationNumber
          required: true
          schema:
            type: string
            example: "40222151504"
        - in: header
          name: identificationType
          required: false
          schema:
            type: string
            example: "Cedula"
        - in: query
          name: applicationId
          required: true
          schema:
            type: string
            example: "APP-20260615-0001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSignedDocumentRequest'
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSignedDocumentResponse'
        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
