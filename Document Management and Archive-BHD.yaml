        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.

    HttpError:
      type: object
      description: Standard structure for API error responses.
      properties:
        ResponseCode:
          type: string
          description: Error response code.
          example: "400BAD"
        Message:
          type: string
          description: Error message.
          example: "Bad request"
        Errors:
