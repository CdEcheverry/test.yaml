components:
  schemas:
    # ---------------------------------------------------------
    # SHARED COMMON SCHEMAS
    # ---------------------------------------------------------
    Value:
      type: object
      description: Value container.
      properties:
        Value:
          type: string
          description: Value of the identifier.
          example: "123456"

    Identifier:
      type: object
      description: Unique identifier information.
      properties:
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    Name:
      type: object
      description: Name object.
      properties:
        Name:
          type: string
          description: Name.
          example: "Document Name"

    Text:
      type: object
      description: Text object.
      properties:
        Text:
          type: string
          description: Text value.
          example: "application/pdf"

    PartyIdentification:
      type: object
      description: Customer identification information.
      properties:
        PartyIdentificationType:
          $ref: '#/components/schemas/PartyIdentificationType'
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    PartyIdentificationType:
      type: string
      description: Type of customer identification document.
      example: Cedula

    ApplicationId:
      type: string
      description: Unique identifier of the onboarding application process.
      example: APP-20260529-0001

    DocumentContent:
      type: object
      description: Content of a document.
      properties:
        Text:
          type: string
          description: Document encoded in Base64, PDF content, or repository reference.
          example: "JVBERi0xLjQKJcfsj6IK..."

    Document:
      type: object
      description: Document managed by Document Services.
      properties:
        DocumentIdentification:
          $ref: '#/components/schemas/Identifier'
        DocumentFormat:
          $ref: '#/components/schemas/Text'
        DocumentContent:
          $ref: '#/components/schemas/Text'

    Date:
      type: object
      description: Date value.
      properties:
        DateContent:
          type: string
          format: string
          description: Date content.
          example: "15-06-2026"

    # ---------------------------------------------------------
    # SCHEMAS - CORRESPONDENCE
    # ---------------------------------------------------------
    OtpSendRequest:
      type: object
      description: Request used to send an OTP code to a customer.
      required:
        - CustomerReference
      properties:
        CustomerReference:
          $ref: '#/components/schemas/InvolvedParty'

    InvolvedParty:
      type: object
      description: Reference to the customer that will receive the OTP.
      properties:
        PartyReference:
          $ref: '#/components/schemas/PartyReference'
        ContactDetails:
          $ref: '#/components/schemas/ContactDetails'

    PartyReference:
      type: object
      description: Customer information.
      properties:
        PartyIdentification:
          $ref: '#/components/schemas/PartyIdentification'

    ContactDetails:
      type: object
      description: Generic set of communication channels associated with the customer.
      properties:
        EmailAddress:
          type: string
          description: Email address that will receive the OTP. If not provided, the email stored in the DB is used.
          example: "test@vusecurity.com"
          minLength: 1
          maxLength: 43200

    OtpSendResponse:
      type: object
      description: Successful OTP send response.
      properties:
        ResponseCode:
          type: string
          example: "200OK"
        Message:
          type: string
          example: "Successful"
        Data:
          $ref: '#/components/schemas/OtpSendData'
        Timestamp:
          type: string
          format: date-time
          example: "2026-08-20T10:30:00Z"
        RequestId:
          type: string
          example: "req_12345"

    OtpSendData:
      type: object
      description: OTP send result.
      properties:
        OtpMessage:
          type: string
          description: Indicates the OTP send result.
          example: "SEND"

    EmailSendRequest:
      type: object
      description: Request used to send an email to a customer using a predefined template.
      properties:
        CustomerReference:
          $ref: '#/components/schemas/EmailCustomerReference'
        CorrespondenceTemplate:
          $ref: '#/components/schemas/CorrespondenceTemplate'

    EmailCustomerReference:
      type: object
      description: Customer reference information.
      properties:
        PartyIdentification:
          $ref: '#/components/schemas/PartyIdentification'

    CorrespondenceTemplate:
      type: object
      description: Template used to send the email correspondence.
      required:
        - TemplateIdentification
      properties:
        TemplateIdentification:
          $ref: '#/components/schemas/TemplateIdentification'

    TemplateIdentification:
      type: object
      description: Name or code of the email template.
      properties:
        TemplateNameOrCode:
          type: string
          description: Name or code of the template used to send the email.
          example: "ONBOARDING_WELCOME_TEMPLATE"

    EmailSendResponse:
      type: object
      description: Successful email send response.
      properties:
        ResponseCode:
          type: string
          example: "200OK"
        Message:
          type: string
          example: "Successful"
        Data:
          $ref: '#/components/schemas/EmailSendData'
        Timestamp:
          type: string
          format: date-time
