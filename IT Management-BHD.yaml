openapi: 3.0.3

info:
  title: Systems Operations - BHD
  description: API to Management the onboarding step for an application process.
  version: 1.0.0

servers:
  - url: https://api.bian.org/v1
    description: Main BIAN server

paths:
 
  /SystemsOperations/OnboardingSteps/Retrieve:
    get:
      tags:
        - CR - SystemOperationAdministration
      summary: Retrieve onboarding step
      description: Retrieve the current onboarding step associated with a customer application process.
      operationId: RetrieveOnboardingStep

      parameters:
        - in: header
          name: identificationNumber
          required: true
          description: Customer identification number.
          schema:
            type: string
            example: "00112345678"

        - in: header
          name: identificationType
          required: false
          description: Customer identification document type.
          schema:
            type: string
            example: "Cedula"

        - in: query
          name: applicationId
          required: true
          description: Application identifier associated with the onboarding process.
          schema:
            type: string
            example: "AP-446655440000"

      responses:
        '200':
          description: Successful onboarding step retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStepsRetrieveResponse'

        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:

  schemas:

    OnboardingStepsRetrieveResponse:
      type: object
      description: Successful onboarding step retrieval response.
      properties:
        ResponseCode:
          type: string
          description: Unique response code that identifies the successful result.
          example: "200OK"

        Message:
          type: string
          description: General message associated with the successful operation.
          example: "Successful"

        Data:
          $ref: '#/components/schemas/OnboardingStepsRetrieveData'

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.
          example: "2026-08-20T10:30:00Z"

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.
          example: "req_12345"

    OnboardingStepsRetrieveData:
      type: object
      description: Current onboarding step information.
      properties:
        OnboardingStep:
          $ref: '#/components/schemas/OnboardingStep'

        ApplicationReference:
          $ref: '#/components/schemas/ApplicationReference'

        PartyReference:
          $ref: '#/components/schemas/PartyReference'


    ApplicationReference:
      type: object
      description: Onboarding application identifier.
      properties:
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    PartyReference:
      type: object
      description: Customer information.
      properties:
        PartyIdentification:
          $ref: '#/components/schemas/PartyIdentification'

    PartyIdentification:
      type: object
      description: Customer identification details.
      properties:
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    Value:
      type: object
      description: Generic string value.
      properties:
        Value:
          type: string
          example: "00112345678"


    OnboardingStep:
      type: object
      description: Current onboarding step where the customer is located.
      properties:
        StepCode:
          type: string
          description: Code of the current onboarding step.
          example: "DEMOGRAPHIC_INFORMATION"

    HttpError:
      type: object
      properties:
        ResponseCode:
          type: string
          example: "400BAD"

        Message:
          type: string
          example: "Bad request"

        Errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'

        Timestamp:
          type: string
          format: date-time

        RequestId:
          type: string

    Error:
      type: object
      properties:
        Field:
          type: string
        Code:
          type: string
        Message:
          type: string

    Response:
      type: object
      description: Standard structure for successful responses.
      properties:
        ResponseCode:
          type: string
          description: Unique response code that identifies the result.

        Message:
          type: string
          description: General message associated with the operation result.

        Timestamp:
          type: string
          format: date-time
          description: Date and time when the response was generated.

        RequestId:
          type: string
          description: Unique identifier associated with the request transaction.




  responses:
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example: 
            ResponseCode: "201CREATED"
            Message: "Created"
            Timestamp: "2026-07-31T10:30:00Z"
            RequestId: "req_12345"            
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example: 
            ResponseCode: "202Accepted"
            Message: "Accepted"
            Timestamp: "2026-07-31T10:30:00Z"
            RequestId: "req_12345"  
    BadRequest:
      description: BadRequest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    NotFound:
      description: NotFound
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    MethodNotAllowed:
      description: MethodNotAllowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    RequestTimeout:
      description: RequestTimeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    UnprocessableContent:
      description: UnprocessableContent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    TooManyRequests:
      description: TooManyRequests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    InternalServerError:
      description: InternalServerError
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    NotImplemented:
      description: NotImplemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    BadGateway:
      description: BadGateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    ServiceUnavailable:
      description: ServiceUnavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    GatewayTimeout:
      description: GatewayTimeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
