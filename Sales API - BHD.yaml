openapi: 3.0.3
info:
  title: Sales Product - BHD
  description: API to retrieve, create, and update active onboarding process information for a customer.
  version: 1.0.0

servers:
  - url: https://api.bian.org/v1
    description: Main BIAN server

paths:
  /api/SalesProduct/customer/{documentNumber}/Email/Retrieve:
    get:
      tags:
        - CR - ProductandServiceAgreement
      summary: Retrieve active onboarding process for a customer
      description: Retrieve information related to an active onboarding process associated with a customer document number and email address.
      operationId: RetrieveCustomerOnboardingStatus

      parameters:
        - in: path
          name: documentNumber
          required: true
          description: Customer identification document number.
          schema:
            type: string
            example: "123456789"

        - in: query
          name: emailAddress
          required: false
          description: Customer email address associated with the onboarding process.
          schema:
            type: string
            format: email
            example: "customer@email.com"

      responses:
        '200':
          description: Successful onboarding status retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOnboardingRetrieveResponse'
        '400':
          description: Bad Request / Business Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource or onboarding process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'

  /api/SalesProduct/Onboarding/Create:
    post:
      tags:
        - CR - ProductandServiceAgreement
      summary: Create customer onboarding process
      description: Create a new onboarding process for a customer, including document identification, email and terms and conditions acceptance.
      operationId: CreateCustomerOnboarding

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOnboardingCreateRequest'

      responses:
        '200':
          description: Successful onboarding process creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOnboardingCreateResponse'
        '400':
          description: Bad Request / Business Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'

  /api/SalesProduct/Onboarding/Update:
    patch:
      tags:
        - CR - ProductandServiceAgreement
      summary: Update customer onboarding process
      description: Update customer onboarding process information, including email and selected brokerage account type.
      operationId: UpdateCustomerOnboarding

      parameters:
        - in: query
          name: applicationId
          required: true
          description: Application identifier associated with the onboarding process.
          schema:
            type: string
            example: "5d596a45-ae94-4835-9612-2588330581a1"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOnboardingUpdateRequest'

      responses:
        '200':
          description: Successful onboarding process update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOnboardingUpdateResponse'
        '400':
          description: Bad Request / Business Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource or onboarding process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'

components:
  schemas:
    CustomerOnboardingRetrieveResponse:
      type: object
      description: Response containing onboarding process information for a customer.
      properties:
        ResponseCode:
          type: string
          example: "200OK"
        Message:
          type: string
          example: "Successful"
        Data:
          $ref: '#/components/schemas/OnboardingData'
        Timestamp:
          type: string
          format: date-time
          example: "2026-05-14T10:30:00Z"
        RequestId:
          type: string
          example: "req_12345"

    OnboardingData:
      type: object
      description: Response data.
      properties:
        CustomerOnboarding:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOnboarding'

    CustomerOnboarding:
      type: object
      properties:
        OnboardingProcessReference:
          $ref: '#/components/schemas/Identifier'
        TermsAndConditionsAcceptance:
          $ref: '#/components/schemas/TermsAndConditionsAcceptance'
        CustomerRole:
          $ref: '#/components/schemas/CustomerOnboardingRole'
        OnboardingStep:
          $ref: '#/components/schemas/OnboardingStep'

    TermsAndConditionsAcceptance:
      type: object
      properties:
        AcceptedIndicator:
          type: boolean
          example: true

    Identifier:
      type: object
      properties:
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    Value:
      type: object
      properties:
        Value:
          type: string
          example: "ONB-20260515-0001"

    CustomerOnboardingCreateRequest:
      type: object
      properties:
        PartyReference:
          $ref: '#/components/schemas/PartyReference'
        ContactReference:
          $ref: '#/components/schemas/ContactReference'
        CustomerRole:
          $ref: '#/components/schemas/CustomerOnboardingRole'
        TermsAndConditionsAcceptance:
          $ref: '#/components/schemas/TermsAndConditionsAcceptance'
        LawReference:
          $ref: '#/components/schemas/LawReference'

    PartyReference:
      type: object
      properties:
        PartyIdentification:
          $ref: '#/components/schemas/PartyIdentification'

    PartyIdentification:
      type: object
      properties:
        PartyIdentificationType:
          type: string
          example: "Cedula"
        IdentifierValue:
          $ref: '#/components/schemas/Value'

    ContactReference:
      type: object
      properties:
        EmailAddress:
          $ref: '#/components/schemas/EmailAddress'

    EmailAddress:
      type: string
      example: "cliente@email.com"

    LawReference:
      type: object
      properties:
        LawVersion:
          type: string
          example: "1.0"

    CustomerOnboardingCreateResponse:
      type: object
      properties:
        ResponseCode:
          type: string
          example: "200OK"
        Message:
          type: string
          example: "Successful"
        Data:
          $ref: '#/components/schemas/OnboardingCreateData'
        Timestamp:
          type: string
          format: date-time
          example: "2026-05-14T10:30:00Z"
        RequestId:
          type: string
          example: "req_12345"

    OnboardingCreateData:
      type: object
      properties:
        CustomerOnboarding:
          $ref: '#/components/schemas/CustomerOnboarding'

    CustomerOnboardingUpdateRequest:
      type: object
      properties:
        PartyReference:
          $ref: '#/components/schemas/PartyReference'
        ContactReference:
          $ref: '#/components/schemas/ContactReference'
        BrokerageAccount:
          $ref: '#/components/schemas/BrokerageAccount'
        JointAccountParticipantReference:
          type: array
          items:
            $ref: '#/components/schemas/JointAccountParticipantReference'

    BrokerageAccount:
      type: object
      properties:
        BrokerageAccountType:
          $ref: '#/components/schemas/BrokerageAccountType'

    BrokerageAccountType:
      type: string
      example: "Individual"

    CustomerOnboardingUpdateResponse:
      type: object
      properties:
        ResponseCode:
          type: string
          example: "200OK"
        Message:
          type: string
          example: "Successful"
        Data:
          $ref: '#/components/schemas/OnboardingUpdateData'
        Timestamp:
          type: string
          format: date-time
          example: "2026-05-14T10:30:00Z"
        RequestId:
          type: string
          example: "req_12345"

    OnboardingUpdateData:
      type: object
      properties:
        Message:
          type: string
          example: "Onboarding process successfully updated"

    JointAccountParticipantReference:
      type: object
      properties:
        PartyReference:
          $ref: '#/components/schemas/JointParticipantPartyReference'

    JointParticipantPartyReference:
      type: object
      properties:
        PartyName:
          $ref: '#/components/schemas/JointParticipantPartyName'
        PartyIdentification:
          $ref: '#/components/schemas/PartyIdentification'
        ContactReference:
          $ref: '#/components/schemas/JointParticipantContactReference'

    JointParticipantPartyName:
      type: object
      properties:
        FirstName:
          type: string
          example: "MARIA"
        LastName:
          type: string
          example: "GOMEZ"

    JointParticipantContactReference:
      type: object
      properties:
        EmailAddress:
          $ref: '#/components/schemas/EmailAddress'

    CustomerOnboardingRole:
      type: string
      example: "Titular"

    OnboardingStep:
      type: object
      properties:
        StepCode:
          type: string
          example: "DEMOGRAPHIC_INFORMATION"

    HttpError:
      type: object
      description: Standard structure for API error responses.
      properties:
        ResponseCode:
          type: string
          example: "ONDI-SalesProduct-UpdateOnboardingProcess-E404"
        Message:
          type: string
          example: "An error occurred"
        Data:
          type: object
          nullable: true
          example: null
        errors:
          type: array
          items:
            type: string
          example: ["No active onboarding process found for the specified identifier."]
        Timestamp:
          type: string
          example: "2026-08-28T23:55:59.7553811Z"
        RequestId:
          type: string
          example: "a5733a34-39c4-4e9e-ae0a-775a1516df10"

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
